# FreeRADIUS EAP configuration profile for Passpoint (Hotspot 2.0)
eap {
  default_eap_type = ttls
  timer_expire = 60
  ignore_unknown_eap_types = no
  cisco_accounting_username_bug = no
  max_sessions = 4096

  # EAP-TLS / Server Certificate for outer tunnel
  tls-config cert-common {
    private_key_file = ${certdir}/server.key
    certificate_file = ${certdir}/server.crt
    ca_file = ${cadir}/ca.pem
    dh_file = ${certdir}/dh
    cipher_list = "DEFAULT"
    ecdh_curve = "prime256v1"
  }

  # EAP-TTLS for Passpoint Release 2
  ttls {
    tls = cert-common
    default_eap_type = mschapv2
    copy_request_to_tunnel = yes
    use_tunneled_reply = yes
    virtual_server = "inner-tunnel"
  }

  # Inner MSCHAPv2 authentication
  mschapv2 {
    send_error = yes
  }
}

