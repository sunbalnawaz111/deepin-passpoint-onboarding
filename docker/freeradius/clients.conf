# FreeRADIUS clients configuration for local Passpoint testing
# Defines Access Point / Wireless LAN Controller (WLC) NAS client

client localhost {
  ipaddr = 127.0.0.1
  proto = *
  secret = testing123
  require_message_authenticator = no
  nas_type = other
}

client docker_network {
  ipaddr = 0.0.0.0/0
  proto = *
  secret = radiussecret123
  require_message_authenticator = no
  nas_type = other
}

